
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.app { padding: 1.5rem 0; }
.tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.tab-btn { flex: 1; padding: 10px 16px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-secondary); font-size: 14px; cursor: pointer; transition: all 0.15s; font-family: var(--font-sans); }
.tab-btn.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); font-weight: 500; }
.panel { display: none; }
.panel.active { display: block; }

/* ── IMAGE MODE ── */
.section-label { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 8px; }
.img-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; margin-bottom: 10px; align-items: start; }
.img-row.full { grid-template-columns: minmax(0,1fr); }
.img-slot { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); padding: 10px; }
.img-slot-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.img-slot-label { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }
.img-preview { width: 100%; height: 64px; object-fit: contain; border-radius: 4px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); display: block; }
.img-placeholder { width: 100%; height: 64px; border-radius: 4px; background: var(--color-background-primary); border: 0.5px dashed var(--color-border-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text-tertiary); font-size: 12px; gap: 6px; }
.img-placeholder:hover { border-color: var(--color-border-primary); color: var(--color-text-secondary); }
.link-input { width: 100%; font-size: 12px; padding: 5px 8px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-family: var(--font-sans); margin-top: 6px; }
.link-input:focus { outline: none; border-color: var(--color-border-primary); }
.remove-btn { background: none; border: none; cursor: pointer; color: var(--color-text-tertiary); padding: 2px; border-radius: 4px; line-height: 1; }
.remove-btn:hover { color: var(--color-text-danger); }

.add-row-bar { display: flex; gap: 8px; margin-bottom: 1rem; }
.add-row-bar button { flex: 1; padding: 8px; border: 0.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); background: none; color: var(--color-text-secondary); font-size: 13px; cursor: pointer; font-family: var(--font-sans); }
.add-row-bar button:hover { background: var(--color-background-secondary); border-color: var(--color-border-primary); color: var(--color-text-primary); }

/* ── CODE MODE ── */
.block-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
.block-btn { padding: 6px 12px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-secondary); font-size: 12px; cursor: pointer; font-family: var(--font-sans); display: flex; align-items: center; gap: 6px; }
.block-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.block-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
.block-card { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); overflow: hidden; }
.block-card-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); }
.block-type-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--color-background-info); color: var(--color-text-info); font-weight: 500; }
.block-card-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.block-input { width: 100%; font-size: 13px; padding: 6px 8px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-family: var(--font-sans); }
.block-input:focus { outline: none; border-color: var(--color-border-primary); }
textarea.block-input { min-height: 70px; resize: vertical; }
.block-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.block-sub-label { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 3px; }
.move-btn { background: none; border: none; cursor: pointer; color: var(--color-text-tertiary); padding: 2px 4px; font-size: 14px; border-radius: 4px; line-height: 1; font-family: var(--font-sans); }
.move-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }

/* ── SHARED ── */
.generate-bar { display: flex; gap: 8px; margin-top: 1.5rem; align-items: center; }
.gen-btn { flex: 1; padding: 10px 16px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-primary); border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; color: var(--color-text-primary); font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; gap: 8px; }
.gen-btn:hover { border-color: var(--color-border-secondary); }
.gen-btn:active { transform: scale(0.98); }
.copy-btn { padding: 10px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: none; font-size: 13px; cursor: pointer; color: var(--color-text-secondary); font-family: var(--font-sans); display: flex; align-items: center; gap: 6px; }
.copy-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.output-area { margin-top: 1rem; }
.output-box { width: 100%; min-height: 120px; font-size: 11px; font-family: var(--font-mono); padding: 10px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-secondary); resize: vertical; }
.output-box:focus { outline: none; }
.status-msg { font-size: 12px; color: var(--color-text-success); padding: 4px 0; }
.color-row { display: flex; gap: 8px; align-items: center; }
.color-swatch { width: 32px; height: 32px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); cursor: pointer; }
.section-divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin: 1.25rem 0; }
.settings-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
.settings-label { font-size: 13px; color: var(--color-text-secondary); min-width: 80px; }
select.block-input { cursor: pointer; }
</style>

<div class="app">
  <h2 class="sr-only">Construtor de e-mail marketing HTML</h2>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('images')"><i class="ti ti-photo" aria-hidden="true"></i> Modo imagens</button>
    <button class="tab-btn" onclick="switchTab('code')"><i class="ti ti-code" aria-hidden="true"></i> Modo código</button>
  </div>

  <!-- ══════════════ IMAGE MODE ══════════════ -->
  <div id="panel-images" class="panel active">
    <div class="settings-row">
      <span class="settings-label">Largura</span>
      <select class="block-input" id="img-width" style="width:120px;">
        <option value="600">600px</option>
        <option value="640">640px</option>
        <option value="700">700px</option>
      </select>
      <span class="settings-label" style="margin-left:8px;">Fundo</span>
      <input type="color" id="img-bg" value="#f4f4f4" class="color-swatch" title="Cor de fundo do e-mail">
    </div>

    <div id="img-rows-container"></div>

    <div class="add-row-bar">
      <button onclick="addImgRow('full')"><i class="ti ti-layout-rows" aria-hidden="true"></i> + Linha única</button>
      <button onclick="addImgRow('half')"><i class="ti ti-layout-columns" aria-hidden="true"></i> + Duas colunas</button>
    </div>

    <div class="generate-bar">
      <button class="gen-btn" onclick="generateImgHTML()"><i class="ti ti-download" aria-hidden="true"></i> Gerar HTML</button>
      <button class="copy-btn" onclick="copyOutput('img-output')"><i class="ti ti-copy" aria-hidden="true"></i> Copiar</button>
    </div>
    <div id="img-status" class="status-msg" style="display:none;"></div>
    <div class="output-area">
      <textarea class="output-box" id="img-output" placeholder="O HTML gerado aparecerá aqui..." readonly></textarea>
    </div>
  </div>

  <!-- ══════════════ CODE MODE ══════════════ -->
  <div id="panel-code" class="panel">
    <div class="settings-row">
      <span class="settings-label">Largura</span>
      <select class="block-input" id="code-width" style="width:120px;">
        <option value="600">600px</option>
        <option value="640">640px</option>
        <option value="700">700px</option>
      </select>
      <span class="settings-label" style="margin-left:8px;">Fundo</span>
      <input type="color" id="code-bg" value="#f4f4f4" class="color-swatch" title="Cor de fundo do e-mail">
    </div>

    <p class="section-label">Adicionar blocos</p>
    <div class="block-toolbar">
      <button class="block-btn" onclick="addBlock('header')"><i class="ti ti-heading" aria-hidden="true"></i> Cabeçalho</button>
      <button class="block-btn" onclick="addBlock('text')"><i class="ti ti-align-left" aria-hidden="true"></i> Texto</button>
      <button class="block-btn" onclick="addBlock('button')"><i class="ti ti-pointer" aria-hidden="true"></i> Botão CTA</button>
      <button class="block-btn" onclick="addBlock('divider')"><i class="ti ti-minus" aria-hidden="true"></i> Divisor</button>
      <button class="block-btn" onclick="addBlock('spacer')"><i class="ti ti-space" aria-hidden="true"></i> Espaço</button>
      <button class="block-btn" onclick="addBlock('columns')"><i class="ti ti-layout-columns" aria-hidden="true"></i> 2 Colunas</button>
      <button class="block-btn" onclick="addBlock('footer')"><i class="ti ti-layout-bottombar" aria-hidden="true"></i> Rodapé</button>
    </div>

    <div id="code-blocks-list" class="block-list"></div>

    <div class="generate-bar">
      <button class="gen-btn" onclick="generateCodeHTML()"><i class="ti ti-download" aria-hidden="true"></i> Gerar HTML</button>
      <button class="copy-btn" onclick="copyOutput('code-output')"><i class="ti ti-copy" aria-hidden="true"></i> Copiar</button>
    </div>
    <div id="code-status" class="status-msg" style="display:none;"></div>
    <div class="output-area">
      <textarea class="output-box" id="code-output" placeholder="O HTML gerado aparecerá aqui..." readonly></textarea>
    </div>
  </div>
</div>

<script>
const imgRows = [];
const codeBlocks = [];
let imgRowCounter = 0;
let blockCounter = 0;

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='images')||(i===1&&tab==='code')));
  document.getElementById('panel-images').classList.toggle('active', tab==='images');
  document.getElementById('panel-code').classList.toggle('active', tab==='code');
}

/* ─────────────────── IMAGE MODE ─────────────────── */
function addImgRow(type) {
  const id = ++imgRowCounter;
  const row = { id, type, slots: type==='full' ? [{ id: id+'a', src: null, link: '' }] : [{ id: id+'a', src: null, link: '' }, { id: id+'b', src: null, link: '' }] };
  imgRows.push(row);
  renderImgRows();
}

function removeImgRow(id) {
  const idx = imgRows.findIndex(r => r.id === id);
  if (idx !== -1) imgRows.splice(idx, 1);
  renderImgRows();
}

function renderImgRows() {
  const container = document.getElementById('img-rows-container');
  container.innerHTML = imgRows.map((row, ri) => `
    <div class="img-row ${row.type==='full'?'full':''}" data-row="${row.id}">
      ${row.slots.map((slot, si) => `
        <div class="img-slot">
          <div class="img-slot-header">
            <span class="img-slot-label">${row.type==='full'?'Imagem '+(ri+1):'Imagem '+(ri+1)+(si===0?'A':'B')}</span>
            ${si===0?`<button class="remove-btn" onclick="removeImgRow(${row.id})" title="Remover linha"><i class="ti ti-x" aria-hidden="true"></i></button>`:''}
          </div>
          ${slot.src
            ? `<img src="${slot.src}" class="img-preview" alt="">`
            : `<div class="img-placeholder" onclick="triggerFileInput('${row.id}','${slot.id}')"><i class="ti ti-upload" style="font-size:16px" aria-hidden="true"></i><span>Clique para enviar</span></div>`
          }
          <input type="file" accept="image/*" style="display:none" id="file-${slot.id}" onchange="handleFile(event,'${row.id}','${slot.id}')">
          <input type="text" class="link-input" placeholder="URL do link (opcional)" value="${slot.link}" oninput="updateSlotLink('${row.id}','${slot.id}',this.value)">
        </div>
      `).join('')}
    </div>
  `).join('');
}

function triggerFileInput(rowId, slotId) {
  document.getElementById('file-' + slotId).click();
}

function handleFile(event, rowId, slotId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const row = imgRows.find(r => r.id == rowId);
    if (!row) return;
    const slot = row.slots.find(s => s.id === slotId);
    if (!slot) return;
    slot.src = e.target.result;
    renderImgRows();
  };
  reader.readAsDataURL(file);
}

function updateSlotLink(rowId, slotId, val) {
  const row = imgRows.find(r => r.id == rowId);
  if (!row) return;
  const slot = row.slots.find(s => s.id === slotId);
  if (slot) slot.link = val;
}

function generateImgHTML() {
  const width = document.getElementById('img-width').value;
  const bg = document.getElementById('img-bg').value;
  const halfW = Math.floor(parseInt(width)/2);

  let rows = '';
  for (const row of imgRows) {
    if (row.type === 'full') {
      const slot = row.slots[0];
      const imgTag = slot.src ? `<img src="${slot.src}" width="${width}" style="display:block;border:0;max-width:100%;" alt="">` : `<!-- imagem não carregada -->`;
      rows += `\n        <tr><td style="padding:0;line-height:0;">${slot.link ? `<a href="${slot.link}" target="_blank" style="display:block;">${imgTag}</a>` : imgTag}</td></tr>`;
    } else {
      const s0 = row.slots[0], s1 = row.slots[1];
      const img0 = s0.src ? `<img src="${s0.src}" width="${halfW}" style="display:block;border:0;max-width:100%;" alt="">` : `<!-- imagem não carregada -->`;
      const img1 = s1.src ? `<img src="${s1.src}" width="${halfW}" style="display:block;border:0;max-width:100%;" alt="">` : `<!-- imagem não carregada -->`;
      const cell0 = s0.link ? `<a href="${s0.link}" target="_blank" style="display:block;">${img0}</a>` : img0;
      const cell1 = s1.link ? `<a href="${s1.link}" target="_blank" style="display:block;">${img1}</a>` : img1;
      rows += `\n        <tr><td style="padding:0;line-height:0;"><table width="${width}" cellpadding="0" cellspacing="0" border="0"><tr><td width="${halfW}" style="padding:0;line-height:0;">${cell0}</td><td width="${halfW}" style="padding:0;line-height:0;">${cell1}</td></tr></table></td></tr>`;
    }
  }

  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
</head>
<body style="margin:0;padding:0;background-color:${bg};">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:${bg};">
  <tr><td align="center" style="padding:20px 0;">
    <table width="${width}" cellpadding="0" cellspacing="0" border="0" style="max-width:${width}px;width:100%;background-color:#ffffff;">${rows}
    </table>
  </td></tr>
</table>
</body>
</html>`;

  document.getElementById('img-output').value = html;
  showStatus('img-status', 'HTML gerado com sucesso!');
}

/* ─────────────────── CODE MODE ─────────────────── */
const blockDefs = {
  header:  { label: 'Cabeçalho', icon: 'ti-heading',        fields: [{ key:'text',    label:'Texto',        type:'text',     placeholder:'Título do e-mail' }, { key:'color', label:'Cor do texto', type:'color', default:'#1a2e4a' }, { key:'bg', label:'Cor de fundo', type:'color', default:'#ffffff' }, { key:'size', label:'Tamanho (px)', type:'text', placeholder:'28', default:'28' }] },
  text:    { label: 'Texto',     icon: 'ti-align-left',     fields: [{ key:'text',    label:'Conteúdo',     type:'textarea', placeholder:'Escreva o conteúdo do bloco...' }, { key:'color', label:'Cor do texto', type:'color', default:'#444444' }, { key:'bg', label:'Cor de fundo', type:'color', default:'#ffffff' }, { key:'size', label:'Tamanho (px)', type:'text', placeholder:'15', default:'15' }] },
  button:  { label: 'Botão CTA', icon: 'ti-pointer',        fields: [{ key:'text',    label:'Texto do botão', type:'text',   placeholder:'Clique aqui' }, { key:'link', label:'URL do link', type:'text', placeholder:'https://' }, { key:'bg',   label:'Cor do botão',  type:'color', default:'#f5c800' }, { key:'color', label:'Cor do texto', type:'color', default:'#1a2e4a' }] },
  divider: { label: 'Divisor',   icon: 'ti-minus',          fields: [{ key:'color',   label:'Cor da linha',  type:'color',   default:'#eeeeee' }, { key:'margin', label:'Margem (px)', type:'text', placeholder:'20', default:'20' }] },
  spacer:  { label: 'Espaço',    icon: 'ti-space',          fields: [{ key:'height',  label:'Altura (px)',   type:'text',    placeholder:'20', default:'20' }] },
  columns: { label: '2 Colunas', icon: 'ti-layout-columns', fields: [{ key:'left',    label:'Texto esquerda', type:'textarea', placeholder:'Conteúdo coluna esquerda...' }, { key:'right', label:'Texto direita', type:'textarea', placeholder:'Conteúdo coluna direita...' }, { key:'color', label:'Cor do texto', type:'color', default:'#444444' }, { key:'bg', label:'Cor de fundo', type:'color', default:'#ffffff' }] },
  footer:  { label: 'Rodapé',    icon: 'ti-layout-bottombar', fields: [{ key:'text',  label:'Texto do rodapé', type:'textarea', placeholder:'© 2025 Empresa. Todos os direitos reservados.' }, { key:'color', label:'Cor do texto', type:'color', default:'#999999' }, { key:'bg', label:'Cor de fundo', type:'color', default:'#f9f9f9' }] },
};

function addBlock(type) {
  const id = ++blockCounter;
  const def = blockDefs[type];
  const values = {};
  def.fields.forEach(f => { values[f.key] = f.default || ''; });
  codeBlocks.push({ id, type, values });
  renderCodeBlocks();
}

function removeBlock(id) {
  const idx = codeBlocks.findIndex(b => b.id === id);
  if (idx !== -1) codeBlocks.splice(idx, 1);
  renderCodeBlocks();
}

function moveBlock(id, dir) {
  const idx = codeBlocks.findIndex(b => b.id === id);
  const to = idx + dir;
  if (to < 0 || to >= codeBlocks.length) return;
  [codeBlocks[idx], codeBlocks[to]] = [codeBlocks[to], codeBlocks[idx]];
  renderCodeBlocks();
}

function updateBlockValue(id, key, val) {
  const block = codeBlocks.find(b => b.id === id);
  if (block) block.values[key] = val;
}

function renderCodeBlocks() {
  const list = document.getElementById('code-blocks-list');
  list.innerHTML = codeBlocks.map((block, bi) => {
    const def = blockDefs[block.type];
    const fields = def.fields.map(f => {
      const val = block.values[f.key] || '';
      if (f.type === 'textarea') return `<div><div class="block-sub-label">${f.label}</div><textarea class="block-input" placeholder="${f.placeholder||''}" oninput="updateBlockValue(${block.id},'${f.key}',this.value)">${val}</textarea></div>`;
      if (f.type === 'color') return `<div><div class="block-sub-label">${f.label}</div><input type="color" class="color-swatch" value="${val||f.default||'#ffffff'}" oninput="updateBlockValue(${block.id},'${f.key}',this.value)"></div>`;
      return `<div><div class="block-sub-label">${f.label}</div><input type="text" class="block-input" placeholder="${f.placeholder||''}" value="${val}" oninput="updateBlockValue(${block.id},'${f.key}',this.value)"></div>`;
    });

    return `
    <div class="block-card">
      <div class="block-card-header">
        <i class="ti ${def.icon}" style="font-size:16px;color:var(--color-text-secondary)" aria-hidden="true"></i>
        <span style="font-size:13px;font-weight:500;flex:1">${def.label}</span>
        <span class="block-type-badge">${block.type}</span>
        <button class="move-btn" onclick="moveBlock(${block.id},-1)" title="Mover para cima" ${bi===0?'disabled':''}>↑</button>
        <button class="move-btn" onclick="moveBlock(${block.id},1)" title="Mover para baixo" ${bi===codeBlocks.length-1?'disabled':''}>↓</button>
        <button class="remove-btn" onclick="removeBlock(${block.id})" title="Remover bloco"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>
      <div class="block-card-body ${def.fields.length > 2 ? 'block-row' : ''}" style="${def.fields.some(f=>f.type==='textarea')?'display:flex;flex-direction:column;gap:8px;':''}">${fields.join('')}</div>
    </div>`;
  }).join('');
}

function generateCodeHTML() {
  const width = document.getElementById('code-width').value;
  const bg = document.getElementById('code-bg').value;
  let rows = '';

  for (const block of codeBlocks) {
    const v = block.values;
    if (block.type === 'header') {
      rows += `\n        <tr><td style="padding:24px 32px 12px;background-color:${v.bg||'#ffffff'};text-align:center;"><p style="margin:0;font-size:${v.size||28}px;font-weight:700;color:${v.color||'#1a2e4a'};font-family:Arial,sans-serif;">${v.text||''}</p></td></tr>`;
    } else if (block.type === 'text') {
      const lines = (v.text||'').replace(/\n/g,'<br>');
      rows += `\n        <tr><td style="padding:12px 32px;background-color:${v.bg||'#ffffff'};"><p style="margin:0;font-size:${v.size||15}px;line-height:1.7;color:${v.color||'#444444'};font-family:Arial,sans-serif;">${lines}</p></td></tr>`;
    } else if (block.type === 'button') {
      rows += `\n        <tr><td style="padding:16px 32px;text-align:center;background-color:#ffffff;"><a href="${v.link||'#'}" target="_blank" style="display:inline-block;padding:14px 32px;background-color:${v.bg||'#f5c800'};color:${v.color||'#1a2e4a'};font-family:Arial,sans-serif;font-size:15px;font-weight:700;text-decoration:none;border-radius:50px;">${v.text||'Clique aqui'}</a></td></tr>`;
    } else if (block.type === 'divider') {
      rows += `\n        <tr><td style="padding:${v.margin||20}px 32px;background-color:#ffffff;"><hr style="border:none;border-top:1px solid ${v.color||'#eeeeee'};margin:0;"></td></tr>`;
    } else if (block.type === 'spacer') {
      rows += `\n        <tr><td style="height:${v.height||20}px;line-height:${v.height||20}px;font-size:1px;">&nbsp;</td></tr>`;
    } else if (block.type === 'columns') {
      const halfW = Math.floor(parseInt(width)/2);
      const l = (v.left||'').replace(/\n/g,'<br>');
      const r = (v.right||'').replace(/\n/g,'<br>');
      rows += `\n        <tr><td style="padding:0;background-color:${v.bg||'#ffffff'};"><table width="${width}" cellpadding="0" cellspacing="0" border="0"><tr><td width="${halfW}" style="padding:16px 20px;vertical-align:top;"><p style="margin:0;font-size:14px;line-height:1.6;color:${v.color||'#444444'};font-family:Arial,sans-serif;">${l}</p></td><td width="${halfW}" style="padding:16px 20px;vertical-align:top;border-left:1px solid #eeeeee;"><p style="margin:0;font-size:14px;line-height:1.6;color:${v.color||'#444444'};font-family:Arial,sans-serif;">${r}</p></td></tr></table></td></tr>`;
    } else if (block.type === 'footer') {
      const lines = (v.text||'').replace(/\n/g,'<br>');
      rows += `\n        <tr><td style="padding:20px 32px;background-color:${v.bg||'#f9f9f9'};text-align:center;"><p style="margin:0;font-size:12px;line-height:1.6;color:${v.color||'#999999'};font-family:Arial,sans-serif;">${lines}</p></td></tr>`;
    }
  }

  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
</head>
<body style="margin:0;padding:0;background-color:${bg};">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:${bg};">
  <tr><td align="center" style="padding:20px 0;">
    <table width="${width}" cellpadding="0" cellspacing="0" border="0" style="max-width:${width}px;width:100%;background-color:#ffffff;">${rows}
    </table>
  </td></tr>
</table>
</body>
</html>`;

  document.getElementById('code-output').value = html;
  showStatus('code-status', 'HTML gerado com sucesso!');
}

/* ─────────────────── UTILS ─────────────────── */
function copyOutput(id) {
  const el = document.getElementById(id);
  if (!el.value) return;
  navigator.clipboard.writeText(el.value).then(() => {
    const statusId = id === 'img-output' ? 'img-status' : 'code-status';
    showStatus(statusId, 'Copiado para a área de transferência!');
  });
}

function showStatus(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

renderImgRows();
renderCodeBlocks();
</script>
